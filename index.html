<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>見好就收</title>
<!-- 本檔為 build/bundle.js 的模板；四個標記由 build 依 ADR-001 §2.4 順序替換（VERSION 讀 package.json）。index.html 是產物，不要手改。 -->
<style>
/* ============================================================
 * 見好就收 v0.1 樣式（依 docs/ui/v1-C.html「手機 App 式」抽出）
 * - 手機直向：底部固定操作列＋市場抽屜
 * - iPad 橫向（media query）：左資訊卡＋右側市場面板
 * - 所有可點元素 ≥ 44×44；「再翻」「停手」≥ 88 高
 * ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#f2f4f7;font-family:"PingFang TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;color:#111;-webkit-text-size-adjust:100%}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

:root{--p:#f0662e;--pd:#c94f1c;--ink:#1c1c1e;--mute:#6b7280;--line:#e5e7eb;--bg:#f2f4f7;--card:#fff;--bad:#d23c3c;--ok:#1f8a5b;--ai:#2f4bd6}
.app{width:100%;height:100%;position:fixed;inset:0;background:var(--bg);color:var(--ink);overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.bar{flex:0 0 auto;min-height:56px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:6px 16px;gap:8px}
.bar .t{font-size:17px;font-weight:700}
.bar .s{font-size:13px;color:var(--mute)}
.bar .ver{margin-left:8px;font-size:11px;color:var(--mute);opacity:.75}
.pill{display:inline-flex;align-items:center;gap:6px;background:#111;color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.pill.lite{background:#eef0f3;color:var(--ink)}
.pill.ai{background:var(--ai)}
.col,.full{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.body{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 132px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card .h{font-size:13px;color:var(--mute);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.card .h b{color:var(--ink)}
.kv{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.kv .big{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1}
.kv .big small{font-size:14px;font-weight:500;color:var(--mute);letter-spacing:0;margin-left:6px}
.kv .side{text-align:right;font-size:13px;color:var(--mute);line-height:1.5}
.kv .side b{color:var(--ink);font-size:16px}
.meter{display:flex;gap:6px;margin-top:10px}
.meter i{flex:1;height:12px;border-radius:6px;background:#e5e7eb;display:block}
.meter i.f{background:var(--bad)}
.meter i.last{box-shadow:inset 0 0 0 2px var(--bad)}
.mrow{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:6px;gap:8px;flex-wrap:wrap}
.mrow b{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.chips .empty{font-size:13px;color:var(--mute);align-self:center}
.chip{min-width:56px;height:44px;padding:0 12px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.chip.in{background:#fff3e8;color:#b3400e;box-shadow:inset 0 0 0 1.5px #f5c9ad}
.chip.x2{box-shadow:inset 0 0 0 2px var(--p)}
.chip .x2m{font-size:11px;font-weight:800;color:#fff;background:var(--p);border-radius:999px;padding:1px 5px;margin-left:5px;line-height:1.4}
.chip.bs{background:#fdecec;color:var(--bad);box-shadow:inset 0 0 0 1.5px #f3b4b4}
.chip.bs::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px}
.chip.ins{background:#e7f5ee;color:var(--ok);box-shadow:inset 0 0 0 1.5px #b7e0c9}
.chip.lk{background:#eef2ff;color:var(--ai);box-shadow:inset 0 0 0 1.5px #c5cdf5}
.chip.fly{animation:chipFly .3s ease-out}
@keyframes chipFly{from{transform:translateY(-32px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.ai{display:flex;align-items:center;gap:12px}
.ai .av{width:44px;height:44px;border-radius:50%;background:#dbe4ff;color:var(--ai);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:0 0 44px}
.ai .av.me{background:#fff3e8;color:#b3400e}
.ai .nm{font-weight:700;font-size:15px}
.ai .st{font-size:13px;color:var(--mute)}
.ai .num{margin-left:auto;text-align:right;font-size:13px;color:var(--mute);line-height:1.4;white-space:nowrap}
.ai .num b{color:var(--ink);font-size:15px;display:block}
.assets{display:flex;flex-wrap:wrap;gap:6px}
.assets span{font-size:13px;background:#eef0f3;border-radius:999px;padding:6px 10px}
.assets .empty{background:transparent;color:var(--mute)}
.note{font-size:14px;line-height:1.5;color:var(--ink)}
.note.ai{border-left:4px solid var(--ai);padding-left:10px}

/* 錯誤橫幅（engine 拒絕或例外時顯示，不讓頁面死掉） */
.err{background:#fdecec;color:var(--bad);border:1px solid #f3b4b4;border-radius:12px;padding:8px 8px 8px 14px;font-size:13px;display:flex;align-items:center;gap:8px}
.err span{flex:1;word-break:break-all}
.err button{min-width:44px;min-height:44px;border:0;background:#fff;border-radius:10px;font-family:inherit;color:var(--bad);font-weight:700}

/* 底部操作列 */
.dock{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 16px 22px;display:flex;gap:10px;z-index:5}
.dk{min-height:64px;min-width:44px;border:0;border-radius:16px;font-family:inherit;font-size:22px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;color:var(--ink);padding:0 8px}
.dk:disabled{opacity:.45;cursor:default}
/* 換畫面後的短暫冷卻（QA B-01）：明顯灰掉並略縮，讓玩家看得出「還不能按」 */
.dk.cool,.dk.cool:disabled{opacity:.3;filter:grayscale(1);transform:scale(.96);box-shadow:none;transition:opacity .15s,transform .15s}
.dk.draw{flex:2;min-height:88px;background:var(--p);color:#fff;box-shadow:0 4px 12px rgba(240,102,46,.35)}
.dk.draw:active:not(:disabled){background:var(--pd)}
.dk.stop{flex:1.4;min-height:88px;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.dk.stop:active:not(:disabled){background:#eee}
.dk.mk{flex:1;background:#eef0f3;color:var(--ink);font-size:13px;font-weight:600;position:relative}
.dk.mk svg{width:24px;height:24px}
.dk.mk .cnt{position:absolute;top:6px;right:8px;background:var(--bad);color:#fff;font-size:11px;border-radius:999px;padding:1px 6px}
.dk.ghost{flex:1;background:#eef0f3;color:var(--ink);font-size:17px;font-weight:600}
.dk.go{flex:2.4;background:var(--p);color:#fff}
.dk.wait{flex:3;background:#eef2ff;color:var(--ai);font-size:16px;font-weight:700;line-height:1.3;text-align:center}
.dk.fast{flex:1;background:#eef0f3;font-size:15px;font-weight:600}
.dk.fast.on{background:var(--ai);color:#fff}

/* 市場抽屜（手機：底部拉出；iPad：右側常駐） */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:6}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:80%;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:8px 16px 24px;transform:translateY(105%);transition:transform .25s;z-index:7;box-shadow:0 -6px 24px rgba(0,0,0,.2)}
.scr.mkopen .scrim{opacity:1;pointer-events:auto}
.scr.mkopen .sheet{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#d1d5db;margin:0 auto 10px}
.sheet .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet .h b{font-size:17px}
.sheet .h button{min-width:44px;min-height:44px;border:0;background:#eef0f3;border-radius:12px;font-family:inherit;font-size:14px;padding:0 12px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;font-family:inherit;text-align:left;color:var(--ink);cursor:pointer;min-height:64px}
.item:first-of-type{border-top:0}
.item .ic{width:44px;height:44px;border-radius:12px;background:#fff3e8;display:flex;align-items:center;justify-content:center;flex:0 0 44px;font-size:20px}
.item .ic svg{width:26px;height:26px}
.item .ic.ins{background:#e7f5ee}
.item .tx{flex:1;min-width:0}
.item .n{font-size:16px;font-weight:700}
.item .d{font-size:12px;color:var(--mute);line-height:1.4}
.item .p{font-size:16px;font-weight:800;white-space:nowrap}
.item.dim .n,.item.dim .p{color:#9ca3af}
.item.dim .d{color:#b0b5bd}
/* 兩種語意（G4.5 第 2、3 列）：afford＝買得起（預覽，虛線邊框）；now＝現在可買（點卡即買，實色價格）。 */
.item .tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;font-size:11px;font-weight:700;vertical-align:middle;line-height:1.5}
.item .tag.afford{color:var(--mute);border:1px dashed #cbd0d6;background:transparent}
.item .tag.now{color:#fff;background:var(--ok)}
.item.now .p{color:var(--ok)}
.item.afford .p{color:var(--mute)}
.item.now:active{background:#fff3e8}
.mrow.legend{margin-top:8px;font-size:12px}

/* 標題／設定 */
.hero{padding:8px 4px 0}
.hero h1{font-size:26px;margin:0 0 4px}
.hero p{margin:0;color:var(--mute);font-size:14px}
.title-hero{padding:32px 4px 8px;text-align:center}
.title-hero h1{font-size:40px;margin:0 0 6px;letter-spacing:2px}
.title-hero p{margin:0;color:var(--mute);font-size:15px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:48px;border:0;border-radius:12px;background:#eef0f3;font-family:inherit;font-size:16px;font-weight:600;color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--mute)}
.field input{min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);width:100%}
.field .hint{font-size:12px;color:var(--mute)}

/* 職業選擇 */
.jobs{display:flex;flex-direction:column;gap:12px}
.job{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.06);border:0;font-family:inherit;text-align:left;cursor:pointer;color:var(--ink);display:flex;gap:14px;align-items:center;min-height:44px;position:relative;width:100%}
.job .ic{width:56px;height:56px;border-radius:14px;background:#fff3e8;display:flex;align-items:center;justify-content:center;flex:0 0 56px;font-size:28px}
.job .nm{font-size:18px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.job .nm small{font-size:12px;color:var(--p);font-weight:600;background:#fff3e8;padding:1px 8px;border-radius:999px}
.job .meta{font-size:13px;color:var(--mute);margin-top:2px}
.job .fl{font-size:12px;color:var(--mute);margin-top:4px}
.job .dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.job .dots i{width:14px;height:14px;border-radius:4px;background:#f5c9ad;display:block}
.job .dots i.m{background:#f0a06e}
.job .dots i.l{background:#c94f1c}
.job .dots i.b{background:var(--bad)}
.job.sel{box-shadow:0 0 0 2px var(--p),0 1px 2px rgba(0,0,0,.06)}
.job .chk{margin-left:auto;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px #cbd0d6;flex:0 0 28px}
.job.sel .chk{background:var(--p);box-shadow:none}
.job.sel .chk::after{content:"";display:block;width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:translate(10px,4px) rotate(45deg)}

/* 結算 */
.sum{background:linear-gradient(135deg,#1c1c1e,#3a3a3f);color:#fff;border-radius:16px;padding:16px}
.sum .h{color:#c7c9cf;font-size:13px;margin-bottom:4px}
.sum .big{font-size:52px;font-weight:800;letter-spacing:-1px;line-height:1}
.sum .big.neg{color:#f3b4b4}
.sum .rows{display:flex;gap:18px;margin-top:12px;font-size:13px;color:#c7c9cf;flex-wrap:wrap}
.sum .rows b{color:#fff;display:block;font-size:16px}
.sum.win{background:linear-gradient(135deg,#1f8a5b,#2fb37a)}
.sum.lose{background:linear-gradient(135deg,#7a1f1f,#c94f1c)}
.card.list{padding:6px 16px}
.seedrow{display:flex;align-items:center;gap:10px}
.seedrow code{flex:1;font-size:18px;font-weight:700;letter-spacing:1px;word-break:break-all}
.seedrow button{min-width:88px;min-height:44px;border:0;background:#eef0f3;border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink)}

/* ===== iPad 橫向：左內容 ＋ 右市場面板 ===== */
@media (min-width: 900px) and (min-aspect-ratio: 1/1) {
  .app{font-size:16px}
  .col{position:absolute;top:56px;bottom:0;left:0;right:400px;display:flex;flex-direction:column}
  .body{padding:16px 24px 132px}
  .dock{padding:12px 24px 20px}
  .col .body{display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:16px}
  .col .body > .card:first-of-type{grid-column:1/3}
  .col .body > .err{grid-column:1/3}
  .col .body .chips{gap:10px}
  .dk{min-height:84px;font-size:28px}
  .dk.draw,.dk.stop{min-height:96px}
  .dk.mk{display:none}
  .scrim{display:none}
  .sheet{position:absolute;left:auto;right:0;top:56px;bottom:0;width:400px;max-height:none;transform:none;border-radius:0;border-left:1px solid var(--line);box-shadow:none;padding:16px 20px;overflow:auto}
  .sheet .grab,.sheet .h button{display:none}
  .kv .big{font-size:56px}
  .chip{height:52px;font-size:18px}
  .jobs{flex-direction:row;align-items:stretch}
  .job{flex:1;flex-direction:column;align-items:flex-start;padding:20px}
  .job .ic{width:72px;height:72px;flex-basis:72px;font-size:36px}
  .job .chk{position:absolute;top:16px;right:16px;margin:0}
  .full{position:absolute;top:56px;bottom:0;left:0;right:0;display:flex;flex-direction:column}
  .full .body{flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:16px}
  .full .body > *{flex:1 1 45%}
  .full .body .hero,.full .body .title-hero,.full .body .jobs,.full .body .err{flex-basis:100%}
  .full .dock{right:0}
  .sum .big{font-size:64px}
  .title-hero h1{font-size:52px}
}

</style>
</head>

<div id="app" class="app"></div>

window.GAME_VERSION = "0.1.0";
</script>

00,"value":240,"effect":{"type":"ADD_TOKENS","param":0},"tokensAdded":["income_l","income_l"],"flavor":"老客人就是資產。"},{"id":"a12","name":"老字號招牌","cost":260,"value":320,"effect":{"type":"ADD_TOKENS","param":0},"tokensAdded":["income_m"],"flavor":"三十年老店，名字本身就值錢。"}]},"tokens":{"tokens":[{"id":"income_s","name":"小單","kind":"income","value":10},{"id":"income_m","name":"中單","kind":"income","value":20},{"id":"income_l","name":"大單","kind":"income","value":40},{"id":"blackSwan","name":"黑天鵝","kind":"blackSwan","value":0,"eventNames":["下雨","衛生稽查","跳電","隔壁攤大特價","瓦斯用完"]},{"id":"insurance","name":"保險籌碼","kind":"insurance","value":0},{"id":"lucky","name":"幸運籌碼","kind":"lucky","value":0}]},"balance":{"rounds":12,"blackSwanThreshold":3,"bustKeepRatio":0.5,"marketSize":3,"insuranceCost":40,"purchasesPerTurn":1,"aiDefaultJobId":"j02","ai":{"easy":{"label":"簡單","swanStopOffset":2,"incomeStop":40,"buyInsurance":false},"normal":{"label":"普通","swanStopOffset":1,"incomeStop":80,"buyInsurance":true},"hard":{"label":"困難","swanStopOffset":1,"incomeStop":120,"buyInsurance":true}},"ui":{"aiStepDelayMs":400,"tokenFlyMs":300,"dockCooldownMs":350}}};
</script>

  return '<div class="card"><div class="ai"><div class="av' + (isMe ? " me" : "") + '">' + (isMe ? "你" : "AI") + '</div><div><div class="nm">' +
    (isMe ? "你" : "AI 對手") + "（" + esc(job ? job.name : "") + ")</div><div class=\"st\">" + esc(statusText) + "</div></div>" +
    '<div class="num">現金 ' + money(p.cash) + "<b>淨資產 " + money(selectors.netWorth(state, pid, data)) + "</b></div></div></div>";

function assetsCard(pid) {

}

function lastTurnText(pid) {
  var round = pid === "ai" ? state.round - 1 : state.round;
  if (round < 1) return "尚未行動";
  var s = turnSummary(pid, round);
  if (s.income === null) return "尚未行動";
  return "上回合翻 " + s.draws + " 顆・" + (s.busted ? "爆倉" : "停手") + "・入帳 " + signed(s.income);
}

function renderPlayDraw() {
  var round = state.round, job = jobOf("human");
  var animateFrom = ui.flyKey === "human:" + (state.players.human.drawn.length - 1) ? state.players.human.drawn.length - 1 : state.players.human.drawn.length;
  ui.flyKey = "human:" + state.players.human.drawn.length;
  return '<section class="scr' + (ui.marketOpen ? " mkopen" : "") + '"><div class="bar"><div><div class="t">第 ' + round + " / " + data.balance.rounds + ' 回合</div><div class="s">你的回合・' + esc(job.name) + "</div></div>" +
    '<span class="pill">現金 ' + money(state.players.human.cash) + "</span></div>" +

    '<button type="button" class="dk stop" data-act="stop" ' + (can({ type: "STOP" }) ? "" : "disabled") + ">停手</button>" +
    '<button type="button" class="dk mk" data-act="openMarket">🏪 市場<span class="cnt">' + state.market.length + "</span></button></div></div>" +
    '<div class="scrim" data-act="closeMarket"></div><div class="sheet"><div class="grab"></div><div class="h"><b>市場・先買先得</b><button type="button" data-act="closeMarket">關閉</button></div>' +
    marketItems(false) + '<div class="mrow" style="margin-top:10px">停手後才能購買，每回合 0–' + data.balance.purchasesPerTurn + " 張</div></div></section>";
}

function renderPlayBuy() {
  var round = state.round, job = jobOf("human");
  var s = turnSummary("human", round);
  var th = selectors.threshold(state, "human", data);
  var p = state.players.human;
  var boughtCard = s.bought ? cardOf(s.bought) : null;
  // P-1 點卡即買：市場項目本身就是購買鈕；dock 只留「跳過」（未買）或「結束回合」（已買）。
  var buyBtn = state.purchasedThisTurn

    '<span class="pill">現金 ' + money(p.cash) + "</span></div>" +
    '<div class="full"><div class="body">' + errHtml() +
    '<div class="sum"><div class="h">本回合入帳</div><div class="big">' + signed(s.income || 0) + '</div><div class="rows">' +
    "<span>" + (p.busted ? "爆倉於" : "停手於") + "<b>第 " + s.draws + " 顆</b></span><span>黑天鵝<b>" + p.blackSwanCount + " / " + th + "</b></span>" +
    "<span>爆倉減半<b>" + (p.busted ? "有" : "無") + "</b></span>" + (s.bonus ? "<span>停手加成<b>＋$" + s.bonus + "</b></span>" : "") +
    "<span>現金<b>" + money(s.cashBefore === null ? p.cash : s.cashBefore) + " → " + money(s.cashAfter === null ? p.cash : s.cashAfter) + "</b></span></div></div>" +
    '<div class="card list"><div class="h" style="margin:8px 0 2px"><span>' +
    (state.purchasedThisTurn ? ("已買下：" + esc(boughtCard ? boughtCard.name : (s.insurance ? "保險" : ""))) : ("點一下即買：用 " + money(p.cash) + " 買 0–" + data.balance.purchasesPerTurn + " 張，或一份保險")) +
    "</span></div>" + (state.purchasedThisTurn ? '<div class="mrow" style="margin:8px 0">本回合購買次數已用完。</div>' : marketItems(true)) + "</div>" +

}

function renderPlayAi() {
  var round = state.round, job = jobOf("ai");
  var animateFrom = ui.flyKey === "ai:" + (state.players.ai.drawn.length - 1) ? state.players.ai.drawn.length - 1 : state.players.ai.drawn.length;
  ui.flyKey = "ai:" + state.players.ai.drawn.length;
  var narr = aiNarration();
  var lastBought = turnSummary("ai", round);
  var boughtText = lastBought.bought ? ("本回合買下：" + (cardOf(lastBought.bought) || {}).name) : (lastBought.insurance ? "本回合買了保險" : "");
  return '<section class="scr"><div class="bar"><div><div class="t">第 ' + round + " / " + data.balance.rounds + ' 回合</div><div class="s">AI 的回合・' + esc(job.name) + "</div></div>" +
    '<span class="pill ai">AI 現金 ' + money(state.players.ai.cash) + "</span></div>" +
    '<div class="col"><div class="body">' + errHtml() + statusCard("ai", animateFrom) +
    '<div class="card"><div class="note ai">' + esc(narr) + (boughtText ? "<br>" + esc(boughtText) : "") + "</div></div>" +
    playerCard("human", "等 AI 翻完就輪到你") + "</div>" +
    '<div class="dock"><button type="button" class="dk wait" disabled>' + esc(narr) + "</button>" +
    '<button type="button" class="dk fast' + (ui.fast ? " on" : "") + '" data-act="toggleFast">' + (ui.fast ? "加速中" : "加速") + "</button></div></div>" +
    '<div class="scrim"></div><div class="sheet"><div class="grab"></div><div class="h"><b>市場</b></div>' + marketItems(false) + "</div></section>";
}

function renderRoundEnd() {
  var round = state.round;
  var last = state.round === data.balance.rounds;
  var nwH = selectors.netWorth(state, "human", data), nwA = selectors.netWorth(state, "ai", data);
  var sh = turnSummary("human", round), sa = turnSummary("ai", round);
  var diff = nwH - nwA;
  return '<section class="scr"><div class="bar"><div><div class="t">第 ' + round + " 回合結束</div><div class=\"s\">" + (last ? "最後一回合" : "還有 " + (data.balance.rounds - round) + " 回合") + "</div></div>" +
    '<span class="pill lite">seed ' + state.seed + "</span></div>" +
    '<div class="full"><div class="body">' + errHtml() +
    '<div class="sum"><div class="h">你的淨資產</div><div class="big">' + money(nwH) + '</div><div class="rows">' +
    "<span>AI 淨資產<b>" + money(nwA) + "</b></span><span>" + (diff === 0 ? "平手<b>—</b>" : ((diff > 0 ? "領先" : "落後") + "<b>" + money(Math.abs(diff)) + "</b>")) + "</span>" +
    "<span>你本回合入帳<b>" + signed(sh.income || 0) + (sh.busted ? "（爆倉）" : "") + "</b></span><span>AI 本回合入帳<b>" + signed(sa.income || 0) + (sa.busted ? "（爆倉）" : "") + "</b></span></div></div>" +
    playerCard("human", "翻 " + sh.draws + " 顆・" + (sh.busted ? "爆倉" : "停手") + (sh.bought ? "・買下" + (cardOf(sh.bought) || {}).name : (sh.insurance ? "・買保險" : ""))) +
    playerCard("ai", "翻 " + sa.draws + " 顆・" + (sa.busted ? "爆倉" : "停手") + (sa.bought ? "・買下" + (cardOf(sa.bought) || {}).name : (sa.insurance ? "・買保險" : ""))) +
    assetsCard("human") + assetsCard("ai") +
    '</div><div class="dock"><button type="button" class="dk go" data-act="nextRound">' + (last ? "看結果" : "下一回合") + "</button></div></div></section>";
}

function renderGameOver() {
  var nwH = selectors.netWorth(state, "human", data), nwA = selectors.netWorth(state, "ai", data);
  var w = state.winner;
  var title = w === "human" ? "你贏了" : (w === "ai" ? "AI 贏了" : "平手");
  var cls = w === "human" ? "win" : (w === "ai" ? "lose" : "");
  return '<section class="scr"><div class="bar"><div><div class="t">本局結束</div><div class="s">' + data.balance.rounds + " 回合・難度 " + esc(diffLabel(state.difficulty)) + "</div></div></div>" +
    '<div class="full"><div class="body">' + errHtml() +
    '<div class="sum ' + cls + '"><div class="h">結果</div><div class="big">' + title + '</div><div class="rows"><span>你的淨資產<b>' + money(nwH) + "</b></span><span>AI 淨資產<b>" + money(nwA) + "</b></span>" +
    "<span>差距<b>" + money(Math.abs(nwH - nwA)) + "</b></span></div></div>" +
    '<div class="card"><div class="h"><span>本局牌局代碼（seed）</span></div><div class="seedrow"><code id="seedText">' + state.seed + '</code><button type="button" data-act="copySeed">複製</button></div>' +
    '<div class="mrow" style="margin-top:8px"><span>' + esc(ui.copyMsg || "回報問題時附上這組代碼，就能重現同一局。") + "</span></div></div>" +
    playerCard("human", "現金 " + money(state.players.human.cash)) + playerCard("ai", "現金 " + money(state.players.ai.cash)) +
    assetsCard("human") + assetsCard("ai") +
    '</div><div class="dock"><button type="button" class="dk go" data-act="restart">再來一局</button></div></div></section>';
}

/* ---------- 主渲染與事件 ---------- */

function render() {
  var html;
  if (state.phase === "lobby") html = ui.screen === "jobSelect" ? renderJobSelect() : renderTitle();
  else if (state.phase === "roundEnd") html = renderRoundEnd();
  else if (state.phase === "gameOver") html = renderGameOver();
  else if (state.currentPlayer === "ai") html = renderPlayAi();
  else if (state.phase === "buy") html = renderPlayBuy();
  else html = renderPlayDraw();
  root.innerHTML = html;
  root.setAttribute("data-phase", state.phase);
  var sc = screenName();
  root.setAttribute("data-screen", sc);
  if (sc !== ui.lastScreen) coolDock();
  ui.lastScreen = sc;
  scheduleAi();
}

/**
 * 操作列冷卻（QA B-01／reviewer M-1）：畫面切換後，各畫面的底部操作列位置重疊，
 * 連點第二下會落在「下一個畫面」的按鈕上（例如停手 → 跳過不買、下一回合 → 停手）。
 * 修法：換畫面後把 dock 內原本可用的按鈕停用 balance.ui.dockCooldownMs，再以 DOM 直接恢復
 * （不重新 render，以免重置 AI 節奏計時器與飛入動畫）。onClick 本就忽略 disabled 元素。
 */
function coolDock() {
  if (ui.coolTimer) { clearTimeout(ui.coolTimer); ui.coolTimer = null; }
  var btns = root.querySelectorAll(".dock button:not([disabled])");
  if (!btns.length) return;
  for (var i = 0; i < btns.length; i++) { btns[i].disabled = true; btns[i].classList.add("cool"); }
  ui.coolTimer = setTimeout(function () {
    ui.coolTimer = null;
    var cooled = root.querySelectorAll(".dock button.cool");
    for (var j = 0; j < cooled.length; j++) { cooled[j].disabled = false; cooled[j].classList.remove("cool"); }
  }, data.balance.ui.dockCooldownMs);
}

function screenName() {
  if (state.phase === "lobby") return ui.screen;
  if (state.phase === "roundEnd") return "roundEnd";
  if (state.phase === "gameOver") return "gameOver";
  if (state.currentPlayer === "ai") return "aiTurn";
  return state.phase === "buy" ? "humanBuy" : "humanTurn";
}

/** 送 action 給 engine；engine 拒絕或例外時只顯示橫幅，不讓頁面死掉。 */
function dispatch(action) {
  try {
    state = reducer.reduce(state, action, data);
    ui.error = null;
  } catch (e) {
    ui.error = "動作未被接受：" + (e && e.message ? e.message : String(e));
  }
  render();
}

/** AI 回合節奏：每步 ≥ aiStepDelayMs（加速時縮短，仍只在 UI 層）。 */
function scheduleAi() {
  if (ui.aiTimer) { clearTimeout(ui.aiTimer); ui.aiTimer = null; }
  if (!isAiTurn() || ui.error) return;
  var delay = data.balance.ui.aiStepDelayMs;
  if (ui.fast) delay = Math.floor(delay / 4);
  ui.aiTimer = setTimeout(function () {
    ui.aiTimer = null;
    if (isAiTurn()) dispatch({ type: "AI_TURN" });
  }, delay);
}

/**
 * 解析牌局代碼（G4.5 第 9 列）：區分「空白」與「無效」。
 * 回傳 { kind: "empty" }（UI 自動產生）、{ kind: "invalid" }（提示且不開局）或 { kind: "ok", value: uint32 }。
 */
var SEED_MAX = 4294967295;
var SEED_ERROR = "牌局代碼需為 0–" + SEED_MAX + " 的整數";
function parseSeed(text) {
  var t = String(text || "").trim();
  if (t === "") return { kind: "empty" };
  if (!/^\d{1,10}$/.test(t)) return { kind: "invalid" };
  var n = Number(t);
  if (n > SEED_MAX) return { kind: "invalid" };
  return { kind: "ok", value: n >>> 0 };
}

function copySeed() {
  var text = String(state.seed);
  var done = function () { ui.copyMsg = "已複製 " + text; render(); };
  var fail = function () { ui.copyMsg = "無法自動複製，請手動長按選取代碼。"; render(); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fail);
      return;
    }
  } catch (e) { /* 走備援 */ }
  try {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "absolute";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand && document.execCommand("copy");
    document.body.removeChild(ta);
    if (ok) done(); else fail();
  } catch (e2) { fail(); }
}

function onClick(ev) {
  var el = ev.target;
  while (el && el !== root && !(el.getAttribute && el.getAttribute("data-act"))) el = el.parentNode;
  if (!el || el === root) return;
  if (el.disabled) return;
  var act = el.getAttribute("data-act"), v = el.getAttribute("data-v");
  switch (act) {
    case "difficulty": ui.difficulty = v; render(); break;
    case "toJobSelect": ui.screen = "jobSelect"; render(); break;
    case "toTitle": ui.screen = "title"; render(); break;
    case "job": ui.jobId = v; render(); break;
    case "start": {
      var parsed = parseSeed(ui.seedInput);
      if (parsed.kind === "invalid") { ui.error = SEED_ERROR; render(); break; } // 無效：提示、不開局
      var seed = parsed.kind === "ok" ? parsed.value : (Date.now() >>> 0); // 空白：只在 UI 層產生 seed（規格 §8.1）
      ui.marketOpen = false; ui.copyMsg = ""; ui.flyKey = "";
      dispatch({ type: "START_GAME", seed: seed, jobId: ui.jobId, difficulty: ui.difficulty });
      break;
    }
    case "draw": dispatch({ type: "DRAW" }); break;
    case "stop": ui.marketOpen = false; dispatch({ type: "STOP" }); break;
    case "openMarket": ui.marketOpen = true; render(); break;
    case "closeMarket": ui.marketOpen = false; render(); break;
    // P-1 點卡即買：點資產卡／保險直接送 action，畫面由 dispatch → render 立即反映。
    case "buyAsset": dispatch({ type: "BUY_ASSET", cardId: v }); break;
    case "buyInsurance": dispatch({ type: "BUY_INSURANCE" }); break;
    case "endTurn": ui.flyKey = ""; dispatch({ type: "END_TURN" }); break;
    case "toggleFast": ui.fast = !ui.fast; render(); break;
    case "nextRound": ui.flyKey = ""; dispatch({ type: "NEXT_ROUND" }); break;
    case "copySeed": copySeed(); break;
    case "restart":
      if (ui.aiTimer) { clearTimeout(ui.aiTimer); ui.aiTimer = null; }
      state = reducer.initialState();
      ui.screen = "title"; ui.error = null; ui.copyMsg = ""; ui.flyKey = "";
      render();
      break;
    case "dismissError": ui.error = null; render(); break;
    default: break;
  }
}

function onInput(ev) {
  if (ev.target && ev.target.id === "seedInput") ui.seedInput = ev.target.value;
}

function boot() {
  data = window.GAME_DATA;
  root = document.getElementById("app");
  if (!data || !root) {
    if (root) root.textContent = "載入失敗：找不到遊戲資料（GAME_DATA）。";
    return;
  }
  state = reducer.initialState();
  root.addEventListener("click", onClick);
  root.addEventListener("input", onInput);
  window.addEventListener("error", function (e) {
    ui.error = "頁面錯誤：" + (e && e.message ? e.message : "未知");
    try { render(); } catch (e2) { /* 已盡力 */ }
  });
  render();
  // 供煙霧測試讀取畫面狀態（唯讀）。
  window.__game = { getState: function () { return state; }, getScreen: screenName };
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

module.exports = { boot: boot };
